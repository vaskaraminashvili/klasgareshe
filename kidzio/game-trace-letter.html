<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Trace letter · Kidzio</title>
<meta name="theme-color" content="#FFF8F1"/>
<link rel="manifest" href="manifest.json"/><link rel="stylesheet" href="../unpkg.com/%40phosphor-icons/web%402.1.1/src/regular/style.css"/>
<link rel="stylesheet" href="../unpkg.com/%40phosphor-icons/web%402.1.1/src/fill/style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link rel="icon" type="image/png" href="assets/images/icon.png"/>

    <!-- Pre-paint theme script (prevents FOUC). Matches crypto/ pattern. -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var theme = saved ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0F0B22' : '#FFF8F1');
      })();
    </script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
<body>
<main class="device-frame min-h-screen flex flex-col safe-top">
  <header class="appbar">
    <a href="game-fill-letter.html" class="icon-btn" data-back aria-label="Close"><i class="ph ph-x"></i></a>
    <div class="grow"><div class="progress"><span id="progressFill" class="w-80"></span></div></div>
    <button id="speakerBtn" type="button" class="icon-btn" aria-label="Hear letter"><i class="ph-fill ph-speaker-high"></i></button>
  </header>

  <section class="px-6 mt-2 text-center">
    <p class="text-xs font-extrabold text-muted tracking-wider">TRACE THE LETTER</p>
    <h1 class="h-display text-2xl mt-2">Follow the dots to draw <span class="text-primary-ink">A</span></h1>
  </section>

  <section class="px-5 mt-5">
    <div class="k-card-lg aspect-square grid place-items-center relative overflow-hidden hero-alphabet">
      <svg id="traceSvg" viewBox="0 0 200 220" class="w-3/4 h-3/4 touch-none" aria-label="Trace letter A">
        <!-- Outline A (target) -->
        <path id="targetPath"
              d="M30 200 L100 30 L170 200 M60 140 L140 140"
              stroke="rgba(255,255,255,.55)"
              stroke-width="20"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
              stroke-dasharray="6 12"/>
        <!-- User trace (dynamic) -->
        <path id="userPath"
              d=""
              stroke="#7C5CFF"
              stroke-width="14"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"/>
        <!-- Dots -->
        <circle cx="30" cy="200" r="6" fill="#FFE27A"/>
        <circle cx="100" cy="30" r="6" fill="#FFE27A"/>
        <circle cx="170" cy="200" r="6" fill="#FFE27A"/>
        <circle cx="60" cy="140" r="4" fill="#FFE27A"/>
        <circle cx="140" cy="140" r="4" fill="#FFE27A"/>
        <!-- Pencil marker -->
        <text id="pencil" x="-50" y="-50" font-size="24">✏️</text>
      </svg>
    </div>
  </section>

  <section class="px-6 mt-4 grid grid-cols-3 gap-3 text-center">
    <div class="k-card p-3">
      <p class="text-xs text-muted">Stars</p>
      <p class="h-display" id="starsVal">☆☆☆</p>
    </div>
    <div class="k-card p-3">
      <p class="text-xs text-muted">Tries</p>
      <p class="h-display" id="triesVal">0/3</p>
    </div>
    <div class="k-card p-3">
      <p class="text-xs text-muted">Accuracy</p>
      <p class="h-display" id="accVal">0%</p>
    </div>
  </section>

  <div class="mt-auto px-6 pb-6 pt-4 safe-bottom grid grid-cols-2 gap-3">
    <button id="restartBtn" type="button" class="btn btn-secondary"><i class="ph ph-arrow-counter-clockwise"></i> Restart</button>
    <button id="nextBtn" type="button" class="btn btn-primary" disabled><i class="ph-fill ph-arrow-right"></i> Next</button>
  </div>
</main>

<script src="assets/js/game-trace-letter.js"></script>
<script src="assets/js/app.js"></script>
<script defer src="index.js"></script></body>
