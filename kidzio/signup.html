<head>

<title>Sign up · Kidzio</title><meta name="theme-color" content="#FFF8F1"/>
<link rel="manifest" href="manifest.json"/><link rel="stylesheet" href="../unpkg.com/%40phosphor-icons/web%402.1.1/src/regular/style.css"/>
<link rel="stylesheet" href="../unpkg.com/%40phosphor-icons/web%402.1.1/src/fill/style.css"/>

<link rel="icon" type="image/png" href="assets/images/icon.png"/>

    <!-- Pre-paint theme script (prevents FOUC). Matches crypto/ pattern. -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var theme = saved ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0F0B22' : '#FFF8F1');
      })();
    </script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
<body>
<main class="device-frame min-h-screen flex flex-col safe-top">
  <header class="appbar">
    <a href="login.html" class="icon-btn" data-back><i class="ph ph-caret-left"></i></a>
    <span class="grow"></span>
    <button class="icon-btn" data-theme-toggle><i class="ph ph-moon"></i></button>
  </header>

  <section class="px-6 pt-2">
    <h1 class="h-display text-3xl">Create account</h1>
    <p class="text-sm mt-1" style="color:var(--color-k-muted)">Fun learning starts in under a minute.</p>
  </section>

  <form class="px-6 mt-5 space-y-3" onsubmit="event.preventDefault();location.href='parent-verify.html'">
    <div class="input-wrap">
      <i class="ph ph-smiley i-left"></i>
      <input type="text" class="input has-left" placeholder="Kid's name"/>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div class="input-wrap"><i class="ph ph-cake i-left"></i><input type="number" min="3" max="14" class="input has-left" placeholder="Age" value="6"/></div>
      <select class="input"><option>Girl</option><option>Boy</option><option>Other</option></select>
    </div>
    <div class="input-wrap">
      <i class="ph ph-envelope-simple i-left"></i>
      <input type="email" class="input has-left" placeholder="Parent email" required/>
    </div>
    <div class="input-wrap">
      <i class="ph ph-lock i-left"></i>
      <input id="np" type="password" class="input has-left has-right" placeholder="Create password" required/>
      <button type="button" class="i-right" data-pwd-toggle="np"><i class="ph ph-eye"></i></button>
    </div>

    <label class="flex items-start gap-2 text-xs pt-1" style="color:var(--color-k-muted)">
      <input type="checkbox" class="mt-1 size-4 accent-[var(--color-k-primary)]" required/>
      <span>I'm the parent/guardian and I agree to the <a class="font-bold" style="color:var(--color-k-primary)" href="#">Terms</a> & <a class="font-bold" style="color:var(--color-k-primary)" href="#">Privacy</a>.</span>
    </label>

    <button class="btn btn-primary w-full mt-2">Create account</button>
  </form>

  <p class="mt-auto pb-8 pt-8 text-center text-sm safe-bottom" style="color:var(--color-k-muted)">
    Already have one? <a href="login.html" class="font-extrabold" style="color:var(--color-k-primary)">Log in</a>
  </p>
</main>
<script src="assets/js/app.js"></script>
<script defer src="index.js"></script></body>
