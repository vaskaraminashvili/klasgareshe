<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Forgot password · Kidzio</title>
    <meta name="theme-color" content="#FFF8F1" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="../unpkg.com/%40phosphor-icons/web%402.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="../unpkg.com/%40phosphor-icons/web%402.1.1/src/fill/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="assets/images/icon.png"/>

    <!-- Pre-paint theme script (prevents FOUC). Matches crypto/ pattern. -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var theme = saved ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0F0B22' : '#FFF8F1');
      })();
    </script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
  <body>
    <main class="device-frame min-h-screen flex flex-col safe-top">
      <header class="appbar">
        <a href="login.html" class="icon-btn" data-back><i class="ph ph-caret-left"></i></a>
        <h1 class="h-display text-lg grow">Forgot password</h1>
      </header>

      <section class="px-6 pt-4">
        <div class="mx-auto size-32 rounded-[28px] tile-coral grid place-items-center mb-4">
          <i class="ph-fill ph-key text-5xl text-white"></i>
        </div>
        <h2 class="h-display text-2xl">Reset your password</h2>
        <p class="text-sm mt-1" style="color: var(--color-k-muted)">Enter the parent email on this account and we'll send a code.</p>
      </section>

      <form
        class="px-6 mt-6 space-y-3"
        onsubmit="
          event.preventDefault();
          location.href = 'otp.html';
        "
      >
        <div class="input-wrap">
          <i class="ph ph-envelope-simple i-left"></i>
          <input type="email" class="input has-left" placeholder="parent@example.com" required />
        </div>
        <button class="btn btn-primary w-full">Send reset code</button>
      </form>

      <div class="px-6 mt-6">
        <div class="k-card flex items-start gap-3 text-xs" style="color: var(--color-k-muted)">
          <i class="ph-fill ph-info text-xl" style="color: var(--color-k-primary)"></i>
          <span>For kids' safety, password resets are always sent to the parent's verified email.</span>
        </div>
      </div>

      <p class="mt-auto pb-8 pt-8 text-center text-sm safe-bottom" style="color: var(--color-k-muted)">Remembered? <a href="login.html" class="font-extrabold" style="color: var(--color-k-primary)">Log in</a></p>
    </main>
    <script src="assets/js/app.js"></script>
  <script defer src="index.js"></script></body>
