<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Word search · Kidzio</title>
<meta name="theme-color" content="#FFF8F1"/>
<link rel="manifest" href="manifest.json"/><link rel="stylesheet" href="../unpkg.com/%40phosphor-icons/web%402.1.1/src/regular/style.css"/>
<link rel="stylesheet" href="../unpkg.com/%40phosphor-icons/web%402.1.1/src/fill/style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link rel="icon" type="image/png" href="assets/images/icon.png"/>

    <!-- Pre-paint theme script (prevents FOUC). Matches crypto/ pattern. -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var theme = saved ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0F0B22' : '#FFF8F1');
      })();
    </script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
<body>
<main class="device-frame min-h-screen flex flex-col safe-top">
  <header class="appbar">
    <a href="learn-words.html" class="icon-btn" data-back aria-label="Close"><i class="ph ph-x"></i></a>
    <div class="grow">
      <p class="text-xs text-muted">Tap &amp; drag letters</p>
      <h1 class="h-display text-lg leading-tight">Word search</h1>
    </div>
    <span class="chip chip-primary" id="progressChip">0 / 5</span>
  </header>

  <section class="px-5">
    <div class="flex flex-wrap gap-2" id="wordChips">
      <span class="chip" data-word-chip="CAT">CAT</span>
      <span class="chip" data-word-chip="SUN">SUN</span>
      <span class="chip" data-word-chip="DOG">DOG</span>
      <span class="chip" data-word-chip="APPLE">APPLE</span>
      <span class="chip" data-word-chip="FISH">FISH</span>
    </div>
  </section>

  <section class="px-5 mt-4">
    <div class="k-card p-3">
      <div class="grid grid-cols-8 gap-1 text-center font-extrabold select-none" id="grid"></div>
    </div>
  </section>

  <section class="px-5 mt-4 grid grid-cols-3 gap-3 text-center">
    <div class="k-card p-3">
      <p class="text-xs text-muted">Time</p>
      <p class="h-display" id="timeVal">0:00</p>
    </div>
    <div class="k-card p-3">
      <p class="text-xs text-muted">Hints</p>
      <p class="h-display" id="hintsVal">3</p>
    </div>
    <div class="k-card p-3">
      <p class="text-xs text-muted">Score</p>
      <p class="h-display" id="scoreVal">0</p>
    </div>
  </section>

  <p id="tip" class="px-6 mt-3 text-xs text-muted flex items-center gap-2">
    <i class="ph-fill ph-info text-primary-ink"></i> Tap the first letter, then the last letter of a word.
  </p>

  <div class="mt-auto px-6 pb-6 pt-4 safe-bottom grid grid-cols-2 gap-3">
    <button id="hintBtn" type="button" class="btn btn-secondary"><i class="ph ph-lightbulb"></i> Hint</button>
    <button id="continueBtn" type="button" class="btn btn-primary" disabled><i class="ph-fill ph-arrow-right"></i> Continue</button>
  </div>
</main>

<script src="assets/js/game-word-search.js"></script>
<script src="assets/js/app.js"></script>
<script defer src="index.js"></script></body>
