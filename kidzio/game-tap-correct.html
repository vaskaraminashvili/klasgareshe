<link rel="manifest" href="manifest.json"/><link rel="stylesheet" href="../unpkg.com/%40phosphor-icons/web%402.1.1/src/regular/style.css"/>

    <!-- Pre-paint theme script (prevents FOUC). Matches crypto/ pattern. -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var theme = saved ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0F0B22' : '#FFF8F1');
      })();
    </script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
<body>
<main class="device-frame min-h-screen flex flex-col safe-top">
  <header class="appbar">
    <a href="game-multiple-choice.html" class="icon-btn" data-back aria-label="Close"><i class="ph ph-x"></i></a>
    <div class="grow"><div class="progress"><span id="progressFill" class="w-50"></span></div></div>
    <span class="chip chip-coral" id="heartsChip">❤️ 3</span>
  </header>

  <section class="px-6 mt-2 text-center">
    <p class="text-xs font-extrabold text-muted tracking-wider">TAP THE CORRECT ONE</p>
    <h1 class="h-display text-2xl mt-2">Which is a <span class="text-primary-ink">number</span>?</h1>
  </section>

  <section class="px-6 mt-6 grid grid-cols-2 gap-3" data-ans-group id="ansGroup">
    <button type="button" class="ans aspect-square flex-col justify-center text-4xl" data-ans=""><span class="h-display">A</span></button>
    <button type="button" class="ans aspect-square flex-col justify-center text-4xl" data-ans="correct"><span class="h-display">7</span></button>
    <button type="button" class="ans aspect-square flex-col justify-center text-4xl" data-ans=""><span class="text-4xl">🐱</span></button>
    <button type="button" class="ans aspect-square flex-col justify-center text-4xl" data-ans=""><span class="h-display">M</span></button>
  </section>

  <section class="px-6 mt-6">
    <div class="k-card flex items-center gap-3">
      <div class="mascot size-12 text-2xl shrink-0">🦉</div>
      <p id="tipText" class="text-sm text-ink"><span class="font-extrabold">Tip:</span> numbers use digits like 0–9.</p>
    </div>
  </section>

  <div class="mt-auto px-6 pb-6 pt-4 safe-bottom">
    <button id="continueBtn" type="button" class="btn btn-primary w-full" disabled>
      <i class="ph-fill ph-arrow-right"></i> Continue
    </button>
  </div>
</main>

<script src="assets/js/game-tap-correct.js"></script>
<script src="assets/js/app.js"></script>
<script defer src="index.js"></script></body>
