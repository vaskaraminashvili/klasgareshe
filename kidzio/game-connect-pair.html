    <!-- Pre-paint theme script (prevents FOUC). Matches crypto/ pattern. -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var theme = saved ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0F0B22' : '#FFF8F1');
      })();
    </script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
<body>
<main class="device-frame min-h-screen flex flex-col safe-top">

  <header class="appbar">
    <a href="game-word-search.html" class="icon-btn" data-back aria-label="Close"><i class="ph ph-x"></i></a>
    <div class="grow">
      <p class="text-xs text-muted">Tap left then right</p>
      <h1 class="h-display text-lg leading-tight">Connect the pair</h1>
    </div>
    <span class="chip chip-sun" id="scoreChip">⭐ 0 / 3</span>
  </header>

  <section class="px-6 mt-1 text-center">
    <p class="text-xs font-extrabold text-muted tracking-wider">MATCH ALL 3 PAIRS</p>
  </section>

  <section class="px-5 mt-4">
    <div class="relative k-card-lg p-2 overflow-hidden">
      <svg id="lineLayer" viewBox="0 0 340 380" class="w-full h-[380px] pointer-events-none" aria-hidden="true">
        <!-- dynamic lines injected here -->
      </svg>
      <div class="absolute inset-0 p-4 flex justify-between">
        <div class="flex flex-col justify-around" id="colLeft">
          <button type="button" class="k-card w-28 text-center pair-card" data-side="L" data-key="bee" data-pos="0">
            <span class="text-3xl">🐝</span><p class="text-xs font-extrabold text-ink">Bee</p>
          </button>
          <button type="button" class="k-card w-28 text-center pair-card" data-side="L" data-key="flower" data-pos="1">
            <span class="text-3xl">🌻</span><p class="text-xs font-extrabold text-ink">Flower</p>
          </button>
          <button type="button" class="k-card w-28 text-center pair-card" data-side="L" data-key="fish" data-pos="2">
            <span class="text-3xl">🐟</span><p class="text-xs font-extrabold text-ink">Fish</p>
          </button>
        </div>
        <div class="flex flex-col justify-around" id="colRight">
          <button type="button" class="k-card w-28 text-center pair-card" data-side="R" data-key="flower" data-pos="0">
            <span class="text-3xl">🍯</span><p class="text-xs font-extrabold text-ink">Honey</p>
          </button>
          <button type="button" class="k-card w-28 text-center pair-card" data-side="R" data-key="bee" data-pos="1">
            <span class="text-3xl">🌸</span><p class="text-xs font-extrabold text-ink">Blossom</p>
          </button>
          <button type="button" class="k-card w-28 text-center pair-card" data-side="R" data-key="fish" data-pos="2">
            <span class="text-3xl">🌊</span><p class="text-xs font-extrabold text-ink">Water</p>
          </button>
        </div>
      </div>
    </div>
  </section>

  <section class="px-6 mt-3">
    <p id="tip" class="flex items-center gap-2 text-xs text-muted">
      <i class="ph-fill ph-info text-primary-ink"></i>
      Tap a card on the left, then its match on the right.
    </p>
  </section>

  <div class="mt-auto px-6 pb-6 pt-4 safe-bottom grid grid-cols-2 gap-3">
    <button id="resetBtn" type="button" class="btn btn-secondary"><i class="ph ph-arrow-counter-clockwise"></i> Reset</button>
    <button id="checkBtn" type="button" class="btn btn-primary" disabled><i class="ph-fill ph-check"></i> Check</button>
  </div>
</main>
