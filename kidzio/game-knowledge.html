    <!-- Pre-paint theme script (prevents FOUC). Matches crypto/ pattern. -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var theme = saved ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0F0B22' : '#FFF8F1');
      })();
    </script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
<body>
<main class="device-frame min-h-screen flex flex-col safe-top">
  <header class="appbar">
    <a href="game-body-parts.html" class="icon-btn" data-back aria-label="Close"><i class="ph ph-x"></i></a>
    <div class="grow"><div class="progress"><span id="progressFill" class="w-70"></span></div></div>
    <span class="chip chip-sky" id="timerChip">⏱️ 00:20</span>
  </header>

  <section class="px-6 mt-2 text-center">
    <p class="text-xs font-extrabold text-muted tracking-wider">GENERAL KNOWLEDGE</p>
    <h1 class="h-display text-2xl mt-2">Which planet is<br/>called the Red Planet?</h1>
  </section>

  <section class="px-6 mt-4">
    <div class="k-card-lg tile-sky aspect-[16/9] grid place-items-center">
      <div class="text-7xl">🪐</div>
    </div>
  </section>

  <section class="px-6 mt-5 space-y-3" data-ans-group id="ansGroup">
    <button type="button" class="ans" data-ans="" data-val="Earth"><span class="ans-key">A</span><span class="grow">Earth</span><span class="text-2xl">🌍</span></button>
    <button type="button" class="ans" data-ans="correct" data-val="Mars"><span class="ans-key">B</span><span class="grow">Mars</span><span class="text-2xl">🔴</span></button>
    <button type="button" class="ans" data-ans="" data-val="Saturn"><span class="ans-key">C</span><span class="grow">Saturn</span><span class="text-2xl">🪐</span></button>
    <button type="button" class="ans" data-ans="" data-val="Jupiter"><span class="ans-key">D</span><span class="grow">Jupiter</span><span class="text-2xl">🟠</span></button>
  </section>

  <section class="px-6 mt-4">
    <div class="grid grid-cols-3 gap-2">
      <button type="button" id="lifeFifty" class="btn btn-soft py-2 min-h-0"><i class="ph ph-lightbulb"></i>50/50</button>
      <button type="button" id="lifePoll" class="btn btn-soft py-2 min-h-0"><i class="ph ph-chart-pie-slice"></i>Poll</button>
      <button type="button" id="lifeHint" class="btn btn-soft py-2 min-h-0"><i class="ph ph-lifebuoy"></i>Hint</button>
    </div>
  </section>

  <div class="mt-auto px-6 pb-6 pt-4 safe-bottom">
    <button id="submitBtn" type="button" class="btn btn-primary w-full" disabled>
      <i class="ph-fill ph-check"></i> Submit
    </button>
  </div>
</main>

<script src="assets/js/game-knowledge.js"></script>
<script src="assets/js/app.js"></script>
<script defer src="index.js"></script></body>
