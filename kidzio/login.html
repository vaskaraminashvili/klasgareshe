    <!-- Pre-paint theme script (prevents FOUC). Matches crypto/ pattern. -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var theme = saved ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0F0B22' : '#FFF8F1');
      })();
    </script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
<body>
<main class="device-frame min-h-screen flex flex-col safe-top">
  <header class="appbar">
    <a href="index.html" class="icon-btn" data-back><i class="ph ph-caret-left"></i></a>
    <span class="grow"></span>
    <button class="icon-btn" data-theme-toggle><i class="ph ph-moon"></i></button>
  </header>

  <section class="px-6 pt-4">
    <img src="assets/images/icon.png" alt="Kidzio" class="mb-4 size-18 rounded-2xl" />
    <h1 class="h-display text-3xl">Welcome back!</h1>
    <p class="text-sm mt-1" style="color:var(--color-k-muted)">Sign in to continue your learning journey.</p>
  </section>

  <form class="px-6 mt-6 space-y-3" onsubmit="event.preventDefault();location.href='home.html'">
    <div class="input-wrap">
      <i class="ph ph-envelope-simple i-left"></i>
      <input type="email" class="input has-left" placeholder="Email or phone" required/>
    </div>
    <div class="input-wrap">
      <i class="ph ph-lock i-left"></i>
      <input id="pwd" type="password" class="input has-left has-right" placeholder="Password" required/>
      <button type="button" class="i-right" data-pwd-toggle="pwd"><i class="ph ph-eye"></i></button>
    </div>

    <div class="flex items-center justify-between text-sm pt-1">
      <label class="flex items-center gap-2"><input type="checkbox" class="size-4 accent-[var(--color-k-primary)]"/><span>Remember me</span></label>
      <a href="forgot-password.html" class="font-bold" style="color:var(--color-k-primary)">Forgot?</a>
    </div>

    <button class="btn btn-primary w-full mt-2">Log in</button>
  </form>

  <div class="px-6 mt-6">
    <div class="flex items-center gap-3 text-xs" style="color:var(--color-k-muted)">
      <span class="flex-1 h-px bg-[color:var(--color-k-border)]"></span>
      <span>or continue with</span>
      <span class="flex-1 h-px bg-[color:var(--color-k-border)]"></span>
    </div>
    <div class="grid grid-cols-3 gap-3 mt-4">
      <button class="btn btn-secondary" aria-label="Continue with Google"><i class="ph ph-google-logo text-2xl"></i></button>
      <button class="btn btn-secondary" aria-label="Continue with Apple"><i class="ph ph-apple-logo text-2xl"></i></button>
      <button class="btn btn-secondary" aria-label="Continue with Facebook"><i class="ph ph-facebook-logo text-2xl"></i></button>
    </div>
  </div>

  <p class="mt-auto pb-8 pt-8 text-center text-sm safe-bottom" style="color:var(--color-k-muted)">
    New here? <a href="signup.html" class="font-extrabold" style="color:var(--color-k-primary)">Create account</a>
  </p>
</main>
<script src="assets/js/app.js"></script>
<script defer src="index.js"></script></body>
