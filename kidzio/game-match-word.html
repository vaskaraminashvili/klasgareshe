    <!-- Pre-paint theme script (prevents FOUC). Matches crypto/ pattern. -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var theme = saved ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0F0B22' : '#FFF8F1');
      })();
    </script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
<body>
<main class="device-frame min-h-screen flex flex-col safe-top">
  <header class="appbar">
    <a href="game-trace-letter.html" class="icon-btn" data-back aria-label="Close"><i class="ph ph-x"></i></a>
    <div class="grow"><div class="progress"><span id="progressFill" class="w-85"></span></div></div>
    <span class="chip chip-primary" id="scoreChip">+0 XP</span>
  </header>

  <section class="px-6 mt-2 text-center">
    <p class="text-xs font-extrabold text-muted tracking-wider">MATCH WORDS TO PICTURES</p>
    <h1 class="h-display text-xl mt-1">Tap a word, then its picture</h1>
  </section>

  <section class="px-5 mt-5 grid grid-cols-2 gap-3">
    <!-- word chips -->
    <div class="space-y-3" id="words">
      <button type="button" class="k-card p-3 text-center font-extrabold text-ink w-full" data-word="sun">sun</button>
      <button type="button" class="k-card p-3 text-center font-extrabold text-ink w-full" data-word="dog">dog</button>
      <button type="button" class="k-card p-3 text-center font-extrabold text-ink w-full" data-word="fish">fish</button>
      <button type="button" class="k-card p-3 text-center font-extrabold text-ink w-full" data-word="car">car</button>
    </div>
    <!-- drop targets -->
    <div class="space-y-3" id="pics">
      <button type="button" class="k-card aspect-[16/9] grid place-items-center text-5xl w-full" data-pic="sun">☀️</button>
      <button type="button" class="k-card aspect-[16/9] grid place-items-center text-5xl w-full" data-pic="dog">🐶</button>
      <button type="button" class="k-card aspect-[16/9] grid place-items-center text-5xl w-full" data-pic="fish">🐟</button>
      <button type="button" class="k-card aspect-[16/9] grid place-items-center text-5xl w-full" data-pic="car">🚗</button>
    </div>
  </section>

  <section class="px-6 mt-4">
    <div class="k-card flex items-center gap-3">
      <div class="mascot size-11 text-xl shrink-0">🦉</div>
      <p id="tip" class="text-sm text-ink"><span class="font-extrabold">Hint:</span> a dog goes "woof"!</p>
    </div>
  </section>

  <div class="mt-auto px-6 pb-6 pt-4 safe-bottom">
    <button id="checkBtn" type="button" class="btn btn-primary w-full" disabled>
      <i class="ph-fill ph-check"></i> Check answers
    </button>
  </div>
</main>
