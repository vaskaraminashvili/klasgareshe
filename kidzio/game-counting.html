<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Counting · Kidzio</title>
<meta name="theme-color" content="#FFF8F1"/>
<link rel="manifest" href="manifest.json"/><link rel="stylesheet" href="../unpkg.com/%40phosphor-icons/web%402.1.1/src/regular/style.css"/>
<link rel="stylesheet" href="../unpkg.com/%40phosphor-icons/web%402.1.1/src/fill/style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link rel="icon" type="image/png" href="assets/images/icon.png"/>

    <!-- Pre-paint theme script (prevents FOUC). Matches crypto/ pattern. -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var theme = saved ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0F0B22' : '#FFF8F1');
      })();
    </script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
<body>
<main class="device-frame min-h-screen flex flex-col safe-top">
  <header class="appbar">
    <a href="game-where-live.html" class="icon-btn" data-back aria-label="Close"><i class="ph ph-x"></i></a>
    <div class="grow">
      <div class="progress"><span id="progressFill" class="w-45"></span></div>
    </div>
    <span class="chip chip-primary" id="scoreChip">⭐ 90</span>
  </header>

  <section class="px-6 mt-2 text-center">
    <p class="text-xs font-extrabold text-muted tracking-wider">MATH EXERCISE</p>
    <h1 class="h-display text-2xl mt-2">Count the apples 🍎</h1>
  </section>

  <section class="px-5 mt-4">
    <div class="k-card-lg tile-coral aspect-[4/3] grid place-items-center">
      <div id="fruitGrid" class="grid grid-cols-4 gap-3 p-3 text-5xl">
        <span>🍎</span><span>🍎</span><span>🍎</span><span>🍎</span>
        <span>🍎</span><span>🍎</span><span>🍎</span><span>🍎</span>
      </div>
    </div>
  </section>

  <section class="px-6 mt-5 flex items-center justify-center gap-4" aria-label="Your answer">
    <button id="minusBtn" type="button" class="icon-btn" aria-label="Lower"><i class="ph ph-minus text-xl"></i></button>
    <div class="h-display text-5xl w-24 text-center text-ink" id="stepperVal" aria-live="polite">0</div>
    <button id="plusBtn" type="button" class="icon-btn" aria-label="Higher"><i class="ph ph-plus text-xl"></i></button>
  </section>

  <section class="px-6 mt-5 grid grid-cols-4 gap-2" data-ans-group id="ansGroup">
    <button type="button" class="ans aspect-square justify-center h-display text-2xl" data-ans="" data-val="6">6</button>
    <button type="button" class="ans aspect-square justify-center h-display text-2xl" data-ans="" data-val="7">7</button>
    <button type="button" class="ans aspect-square justify-center h-display text-2xl" data-ans="correct" data-val="8">8</button>
    <button type="button" class="ans aspect-square justify-center h-display text-2xl" data-ans="" data-val="9">9</button>
  </section>

  <p id="feedback" class="px-6 mt-4 text-center text-xs text-muted">
    Tap a number or use − / + — then press Check.
  </p>

  <div class="mt-auto px-6 pb-6 pt-4 safe-bottom">
    <button id="checkBtn" type="button" class="btn btn-primary w-full" disabled>
      <i class="ph-fill ph-check"></i> Check
    </button>
  </div>
</main>

<script src="assets/js/game-counting.js"></script>
<script src="assets/js/app.js"></script>
<script defer src="index.js"></script></body>
